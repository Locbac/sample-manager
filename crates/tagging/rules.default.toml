# scoutkit ruleset v0.1 — USER-EDITABLE by design.
# [[rules]] tag = canonical tag name; terms = exact lowercase tokens that
# resolve to it; weight = base confidence for a direct filename hit.
# Folder hits are scaled by [folder].weight and distance (1/depth).
version = "v0.1.0"

[folder]
enabled = true
weight = 0.5
max_depth = 3

# --- 808 & sub bass ---------------------------------------------------------
[[rules]]
tag = "808"
terms = ["808", "808s", "sub808", "bass808", "jerk808", "808z"]
weight = 1.0

# --- drums ------------------------------------------------------------------
[[rules]] 
tag = "kick"        
terms = ["kick", "bd", "kik", "bassdrum", "bassdrm", "kickdrum", "kicks", "kikz"]  
weight = 1.0

[[rules]] 
tag = "snare"       
terms = ["snare", "sd", "snr", "snares", "snarz"]                            
weight = 1.0

[[rules]] 
tag = "clap"        
terms = ["clap", "clps", "claps", "clapshot", "snap", "snaps"]                       
weight = 1.0

[[rules]] 
tag = "tom"         
terms = ["tom", "toms", "floortom", "racktom", "hitom", "lotom", "midtom"]                      
weight = 1.0

[[rules]] 
tag = "rim"         
terms = ["rim", "rimshot", "stick", "sidestick", "cross"]                    
weight = 1.0

[[rules]] 
tag = "hihat"  
terms = ["ch", "hh", "hhc", "closedhat", "hats", "hat", "hihat", "hihats", "closedhh"]            
weight = 0.95

[[rules]] 
tag = "openhat"    
terms = ["oh", "ohh", "openhat", "openhats", "pedalhat", "openhh"]            
weight = 1.0

[[rules]] 
tag = "crash"       
