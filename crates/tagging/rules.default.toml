# scoutkit ruleset v0.2 — Comprehensive ADSR taxonomy with genre, instrument, and category hierarchies.
# [[rules]]
# tag: canonical tag name
# kind: 'genre' | 'category' | 'instrument' | 'character' | 'descriptor' | 'mood'
# parent: optional parent tag name (inherits category context, e.g. snare -> drums)
# excludes: negative terms to prevent false positives (e.g. dubstep excludes dub)
# terms: exact lowercase tokens or multi-word phrases that resolve to it
# weight: confidence score for direct match (scaled by depth for folder hits)
version = "v0.2.0"

[folder]
enabled = true
weight = 0.85
max_depth = 10

# =============================================================================
