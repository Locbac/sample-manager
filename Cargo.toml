[workspace]
resolver = "2"
members = [
    "crates/db",
    "crates/scanner",
    "crates/tagging",
    "crates/search",
    "crates/audio",
    "crates/embedded",
    "crates/import-adsr",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
eframe            = { version = "0.37", default-features = false, features = ["default_fonts", "wayland", "x11", "wgpu"] }
egui_extras       = "0.37"
# --- fundamentals -----------------------------------------------------------
anyhow            = "1"
thiserror         = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
toml              = "0.8"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- persistence -------------------------------------------------------------
rusqlite          = { version = "0.32", features = ["bundled", "collation"] } # bundled => no system sqlite needed

# --- filesystem / concurrency ------------------------------------------------
walkdir           = "2"
crossbeam         = "0.8"
parking_lot       = "0.12"

# --- content identity --------------------------------------------------------
xxhash-rust       = { version = "0.8", features = ["xxh3"] } # fast identity; sha2 optional for paranoia
sha2              = "0.10"

# --- audio -------------------------------------------------------------------
# Feature-list only what you ship. "alac" and "isomp4" cover m4a; drop what
# you do not want to support.
symphonia         = { version = "0.5", default-features = false,
                      features = ["all-codecs", "all-formats"] }
cpal              = "0.15"

# --- embedded metadata -------------------------------------------------------
lofty             = "0.22"

# --- CLI ---------------------------------------------------------------------
clap              = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Compile audio decoding dependencies with optimizations even in dev profile
# so software MP3/FLAC/AAC decompression runs 50x faster with zero UI lag
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3

# Spikes live OUTSIDE the workspace so they can fail/pin independently:
#   spikes/drag-out      (tauri 2 + tauri-plugin-drag — THE gate)
#   spikes/audio-preview (symphonia + cpal)
#   spikes/sqlite-bench  (rusqlite, 1M synthetic paths)
